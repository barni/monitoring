# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B clean install
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  # Meldet den von Maven aufgeloesten Abhaengigkeitsbaum an GitHub. Ohne diesen
  # Schritt sieht Dependabot nur die Deklarationen aus der pom.xml, und die
  # tragen keine Versionen, weil das Spring-Boot-BOM sie verwaltet. Ergebnis
  # waeren dauerhaft null Alerts - nicht weil nichts gefunden wird, sondern weil
  # nichts geprueft werden kann.
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Abhaengigkeitsbaum an GitHub melden
      # Auf Commit-SHA gepinnt (v6.0.1), damit ein verschobenes Tag keinen
      # fremden Code in die Pipeline bringt.
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
